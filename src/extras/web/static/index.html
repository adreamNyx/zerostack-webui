<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zerostack · web ui</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
<div id="app">

  <!-- ══ 顶栏 ══ -->
  <header id="topbar">
    <button id="btn-sidebar" class="icon-btn" title="侧栏">☰</button>
    <div class="brand">ZERO<span>STACK</span></div>
    <div id="tb-session" class="tb-item" title="当前会话">—</div>
    <div class="tb-spacer"></div>
    <select id="model-select" class="mono" title="切换模型"></select>
    <div id="tb-status" class="tb-dot off" title="连接状态"></div>
    <button id="btn-panel" class="icon-btn" title="统计面板">📊</button>
  </header>

  <!-- ══ 左侧：会话栏 ══ -->
  <aside id="sidebar">
    <button id="btn-new" class="btn-new">＋ 新会话</button>
    <div class="side-label">最近会话</div>
    <div id="session-list" class="session-list"></div>
    <div class="side-foot">
      <div class="side-label">工作目录</div>
      <div id="side-cwd" class="mono side-cwd">—</div>
    </div>
  </aside>

  <!-- ══ 中间：聊天流 ══ -->
  <main id="chat">
    <div id="stream"></div>

    <!-- 权限询问（内嵌卡片由 JS 动态插入 stream） -->

    <div id="inputbar">
      <div id="perm-banner" class="hidden"></div>
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行…"></textarea>
        <button id="btn-send" class="btn-send" title="发送">➤</button>
        <button id="btn-stop" class="btn-stop hidden" title="停止">■</button>
      </div>
      <div class="input-hint mono">
        <span id="hint-context">ctx —</span>
        <span id="hint-cost">¥ —</span>
      </div>
    </div>
  </main>

  <!-- ══ 右侧：统计面板 ══ -->
  <aside id="panel">
    <div class="panel-sec">
      <div class="panel-title">TOKEN 统计</div>
      <div class="stat-grid">
        <div class="stat"><div class="stat-v mono" id="st-in">0</div><div class="stat-k">输入</div></div>
        <div class="stat"><div class="stat-v mono" id="st-out">0</div><div class="stat-k">输出</div></div>
        <div class="stat"><div class="stat-v mono" id="st-cache-r">0</div><div class="stat-k">缓存读</div></div>
        <div class="stat"><div class="stat-v mono" id="st-cache-w">0</div><div class="stat-k">缓存写</div></div>
      </div>
      <div class="ctx-block">
        <div class="ctx-head"><span>上下文占用</span><span class="mono" id="ctx-pct">—</span></div>
        <div class="ctx-bar"><div id="ctx-fill"></div></div>
        <div class="ctx-sub mono"><span id="ctx-used">—</span> / <span id="ctx-window">—</span></div>
      </div>
      <div class="cost-row"><span>累计费用</span><span class="mono" id="st-cost">¥0.0000</span></div>
      <div class="cost-row"><span>消息数</span><span class="mono" id="st-msgs">0</span></div>
    </div>

    <div class="panel-sec">
      <div class="panel-title">会话</div>
      <div class="kv"><span>ID</span><span class="mono" id="kv-id">—</span></div>
      <div class="kv"><span>模型</span><span class="mono" id="kv-model">—</span></div>
      <div class="kv"><span>提供商</span><span class="mono" id="kv-provider">—</span></div>
    </div>

    <div class="panel-sec">
      <div class="panel-title">运行状态</div>
      <div class="kv"><span>状态</span><span id="kv-run" class="ok">空闲</span></div>
      <div class="kv"><span>WS</span><span id="kv-ws" class="ok">已连接</span></div>
    </div>
  </aside>

</div>
<script src="/app.js"></script>
</body>
</html>
